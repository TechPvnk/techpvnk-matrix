<!DOCTYPE html>
<html>
<head>
<style>

body {

    margin: 0;
    background: black;

    display: flex;
    justify-content: center;
    align-items: center;

    height: 100vh;

    overflow: hidden;

    font-family: monospace;
}

img {

    width: 400px;

    image-rendering: pixelated;

    opacity: 0.92;

    animation:
        pulse 2s infinite alternate;
}

@keyframes pulse {

    from {
        opacity: 0.7;
    }

    to {
        opacity: 1;
    }
}

</style>
</head>

<body>

<img src="assets/splash.png">

</body>
</html>
